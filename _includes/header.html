<header class="site-header">
  <div class="container">
    <div class="site-brand">
      <a href="{{ site.baseurl }}/" class="logo-box">
        <div class="logo-glow">
          <img src="{{ site.baseurl }}/assets/icons/icon_transparent_black.svg" alt="Logo">
        </div>
        <div class="logo-text">
          <h1>PERIAN</h1>
          <h2>DEVELOPMENT</h2>
        </div>
      </a>
    </div>

    <nav class="site-nav">
      {% for item in site.data.navigation %}
        {% if item.url == '/' %}
          <a href="{{ site.baseurl }}/" class="{% if page.url == '/' or page.url == '/index.html' %}active{% endif %}">
            {{ item.label }}
          </a>
        {% else %}
          <a href="{{ site.baseurl }}{{ item.url }}" class="{% if page.url contains item.url %}active{% endif %}">
            {{ item.label }}
          </a>
        {% endif %}
      {% endfor %}
    </nav>

    <button class="hamburger-btn" aria-label="Open menu">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
  </div>

  <div class="sidebar-elements">
    <aside class="sidebar" role="navigation" aria-label="Mobile menu">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <div class="logo-glow">
            <img src="{{ site.baseurl }}/assets/icons/icon_transparent_black.svg" alt="Logo">
          </div>
          <span class="sidebar-menu-text">Menu</span>
        </div>
        <button class="sidebar-close" aria-label="Close menu">✕</button>
      </div>
      <nav class="sidebar-nav">
        {% for item in site.data.navigation %}
          {% if item.url == '/' %}
            <a href="{{ site.baseurl }}/" class="{% if page.url == '/' or page.url == '/index.html' %}active{% endif %}">
              {{ item.label }}
            </a>
          {% else %}
            <a href="{{ site.baseurl }}{{ item.url }}" class="{% if page.url contains item.url %}active{% endif %}">
              {{ item.label }}
            </a>
          {% endif %}
        {% endfor %}
      </nav>
    </aside>
  </div>
</header>
