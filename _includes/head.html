<!-- ================= BASIC ================= -->
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{ page.title | default: "Perian Development" }}</title>
<meta name="description" content="{{ page.description | default: "Perian Development Website" }}">

<!-- ================= DARK MODE ================= -->
<meta name="color-scheme" content="dark">
<meta name="darkreader-lock">

<!-- ================= SEO ================= -->
<meta name="robots" content="index, follow">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- ================= SOCIAL PREVIEWS ================= -->
<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content=">{{ page.title | default: "Perian Development" }}">
<meta property="og:description" content="{{ page.description | default: 'Perian Development Website' }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="/assets/icons/og-icon.png">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content=">{{ page.title | default: "Perian Development" }}">
<meta name="twitter:description" content="{{ page.description | default: 'Perian Development Website' }}">
<meta name="twitter:image" content="/assets/icons/og-icon.png">

<!-- ================= ICONS ================= -->
<link rel="icon" href="/assets/icons/icon_shape.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">

<!-- ================= STYLES ================= -->
<link rel="stylesheet" href="/css/main.css">
