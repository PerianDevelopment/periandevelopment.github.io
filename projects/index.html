<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ================= BASIC ================= -->
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Projects - Perian Development</title>
  <meta name="description" content="Perian Development Website">

  <!-- ================= DARK MODE ================= -->
  <meta name="color-scheme" content="dark">
  <meta name="darkreader-lock">

  <!-- ================= SEO ================= -->
  <meta name="robots" content="index, follow">

  <!-- ================= SOCIAL PREVIEWS ================= -->
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content=">Perian Development">
  <meta property="og:description" content="Perian Development Website">
  <meta property="og:url" content="https://periandevelopment.github.io">
  <meta property="og:image" content="https://periandevelopment.github.io/assets/icons/og-icon.png">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Perian Development">
  <meta name="twitter:description" content="Perian Development Website">
  <meta name="twitter:image" content="https://periandevelopment.github.io/assets/icons/og-icon.png">

  <!-- ================= ICONS ================= -->
  <link rel="icon" href="https://periandevelopment.github.io/assets/icons/icon_shape.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="https://periandevelopment.github.io/assets/icons/apple-touch-icon.png">
  
  <!-- ================= STYLE ================= -->
  <link rel="stylesheet" href="css/main.css" />

  <!-- ================= SCRIPTS ================= -->
  <script src="../js/include.js" defer></script>
  <script src="../js/main.js" defer></script>
  <script src="projects.js" defer></script>
  
</head>
<body>
<!-- ===================== HEADER ===================== -->
  <header class="site-header"></header>

<!-- ===================== HERO ===================== -->
  <section class="hero hero--projects">
    <div class="hero__bg">
      <video class="hero__video" autoplay muted loop playsinline>
        <source src="../assets/videos/hero_projects.mp4" type="video/mp4">
      </video>
    </div>
    <div class="hero__dark-overlay"></div>
    <div class="hero__overlay"></div>
    <div class="hero__grid"></div>
    <div class="hero__vignette"></div>
    <div class="hero__filter"></div>

    <div class="hero__content container">
      <h1 class="title">Explore the <span class="text-highlight">Projects</span></h1>
      <p class="subtitle">
        I'm always working on something new, from small prototypes to fully realized games.  
        Explore everything I've built and see what's next in development.
      </p>
    </div>
  </section>

  <!-- ===================== PROJECT CARDS ===================== -->
  <section class="section all-projects">
    <div class="container reveal">
      <div class="search-container">
		<div class="search-bar">
			<input type="text" id="projectSearch" placeholder="Search projects..." />
			<div class="search-divider"></div>
			<p class="project-count">Showing all <span class="count-number">0</span> projects</p>
		</div>
	  </div>

      <div class="cards" id="projectsContainer">
        <!-- Project cards will be dynamically loaded here -->
      </div>
    </div>
  </section>

  
  <!-- ===================== FOOTER ===================== -->
  <footer class="site-footer"></footer>

</body>
</html>
